# Escape — scan staging after each deployment, wait for the scan, then publish the report
#
# Flow: push / merge on main → "Deploy to staging" → this workflow (separate, never blocks the deploy):
#   1. starts an Escape scan of the profile (tagged with the deployed commit),
#   2. waits for it (scans take 15 min to 6 h),
#   3. builds the report: job summary + the Escape PDF as the `escape-report.pdf` artifact.
#
# A GitHub-hosted job can't run more than 6 h. This job waits up to 5 h 20 min; if the scan is
# still running, it re-dispatches this workflow with the scan id, and the new run resumes the wait.
#
# Setup (Settings → Secrets and variables → Actions → Repository):
#   Secret    ESCAPE_API_KEY       (required) Escape public API key
#   Variable  ESCAPE_PROFILE_ID    (required) profile to scan
#   Variable  ESCAPE_FAIL_ON       (optional) critical | high | medium | low | info — marks this run failed
#                                  when open findings reach it (the deployment itself is never blocked)

name: Escape scan

on:
  workflow_run:
    workflows: ["Deploy to staging"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_id:
        description: "Resume: wait for / report on this scan id (empty = start a new scan)"
        required: false
        default: ""
      start_new_scan:
        description: "Start a new scan (ignored when scan_id is set). Unchecked = report on the profile's last scan"
        type: boolean
        default: true
      profile_id:
        description: "Escape profile id (empty = ESCAPE_PROFILE_ID variable)"
        required: false
        default: ""
      fail_on:
        description: "Mark the run failed if an open finding is at or above this severity"
        type: choice
        options: [default, none, critical, high, medium, low, info]
        default: default
      full:
        description: "Do not truncate descriptions / remediations"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # re-dispatch this workflow for long scans, delete the previous report artifacts

env:
  WAIT_TIMEOUT: 19200 # 5 h 20 min of waiting per run, leaves time for the PDF and the uploads
  # Report latency once the scan ends: ≤ 30 s to notice it + data collection (~1-2 min, while Escape
  # renders the PDF) + uploads. The PDF wait is capped so the report is out ≤ ~10 min after the scan.
  PDF_TIMEOUT: 480

jobs:
  scan:
    name: Escape scan & report
    # Only after a successful deployment (or a manual run)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start scan, wait for it, build the report
        id: report
        env:
          ESCAPE_API_KEY: ${{ secrets.ESCAPE_API_KEY }}
          ESCAPE_PROFILE_ID: ${{ inputs.profile_id || vars.ESCAPE_PROFILE_ID }}
          # The deployed commit, attached to the scan in Escape
          ESCAPE_COMMIT_HASH: ${{ github.event.workflow_run.head_sha || github.sha }}
          ESCAPE_COMMIT_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          ESCAPE_COMMIT_AUTHOR: ${{ github.event.workflow_run.actor.login || github.actor }}
          SCAN_ID: ${{ inputs.scan_id }}
          START_NEW: ${{ github.event_name == 'workflow_run' || inputs.start_new_scan }}
          FAIL_ON: ${{ (inputs.fail_on == '' || inputs.fail_on == 'default') && vars.ESCAPE_FAIL_ON || inputs.fail_on }}
          FULL: ${{ inputs.full }}
        run: |
          args=(--output escape-report.md --pdf escape-report.pdf --pdf-timeout "$PDF_TIMEOUT" --no-step-summary
                --wait --wait-timeout "$WAIT_TIMEOUT")
          if [ -n "$SCAN_ID" ]; then
            args+=(--scan "$SCAN_ID")
          elif [ "$START_NEW" = "true" ]; then
            args+=(--start-scan)
          fi
          [ -n "$FAIL_ON" ] && [ "$FAIL_ON" != "none" ] && args+=(--fail-on "$FAIL_ON")
          [ "$FULL" = "true" ] && args+=(--full)

          set +e
          python3 escape_scan_report_mermaid.py "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 3 = scan still running: not an error, the next step hands over to a new run
          [ "$code" -eq 3 ] && exit 0
          exit "$code"

      # Scan longer than this job can wait: continue in a fresh run, same scan, same options
      - name: Hand over to a new run (scan still running)
        if: steps.report.outputs.exit_code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_ID: ${{ steps.report.outputs.scan_id }}
          PROFILE_ID: ${{ inputs.profile_id }}
          FAIL_ON: ${{ inputs.fail_on || 'default' }}
          FULL: ${{ inputs.full || false }}
        run: |
          gh workflow run escape-scan.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f scan_id="$SCAN_ID" -f profile_id="$PROFILE_ID" -f fail_on="$FAIL_ON" -f full="$FULL"
          {
            echo "### ⏳ Escape scan still running"
            echo ""
            echo "Scan [\`$SCAN_ID\`](https://app.escape.tech/scans/$SCAN_ID/) is still running after 5 h 20 min."
            echo "The wait continues in a new **Escape scan** run, which will publish the report."
          } >> "$GITHUB_STEP_SUMMARY"

      # The Escape PDF alone, not zipped (archive: false): the header link downloads the PDF itself.
      # With archive: false the artifact is named after the file: escape-report.pdf
      - name: Upload PDF report
        id: upload_pdf
        if: always() && hashFiles('escape-report.pdf') != ''
        uses: actions/upload-artifact@v7
        with:
          path: escape-report.pdf
          archive: false
          retention-days: 90

      - name: Upload Markdown report
        id: upload_md
        if: always() && hashFiles('escape-report.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: escape-report-markdown
          path: escape-report.md
          retention-days: 90

      # Shown on the run page; the header's PDF link is swapped for the PDF artifact's direct URL
      - name: Publish job summary
        if: always() && hashFiles('escape-report.md') != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PDF_URL: ${{ steps.upload_pdf.outputs.artifact-url }}
        run: |
          if [ -n "$PDF_URL" ]; then
            sed "s|${RUN_URL}#artifacts|${PDF_URL}|g" escape-report.md > summary.md
          else
            cp escape-report.md summary.md
          fi
          # GitHub rejects job summaries above 1 MiB
          if [ "$(wc -c < summary.md)" -gt 1040000 ]; then
            head -c 1040000 summary.md > "$GITHUB_STEP_SUMMARY"
            printf '\n\n> ⚠️ Report truncated to fit the 1 MiB job summary limit. Full report in the artifact.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Override the old report: keep only this run's artifacts for the branch
      - name: Delete previous reports
        if: always() && (steps.upload_pdf.outputs.artifact-id != '' || steps.upload_md.outputs.artifact-id != '')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          for name in escape-report.pdf escape-report-markdown; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
              --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID} and .workflow_run.head_branch == \"${BRANCH}\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" && echo "Deleted previous ${name} artifact ${id}"
            done
          done
